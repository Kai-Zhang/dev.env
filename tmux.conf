set-option -g base-index 1
set-option -g display-time 100000
set-option -g repeat-time 1000
set-option -g status-keys vi
set-option -g history-limit 20000
set -g status-position bottom
set -g status-left '#[fg=cyan][#S]'
set -g status-right "#[fg=cyan][%m/%d %H:%M]"
set-option -g status-right-length 20
set-window-option -g window-status-current-style bg=red
set-window-option -g automatic-rename off
set-window-option -g mode-keys vi
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix
unbind '"'
bind - split-window -v -c "#{pane_current_path}"
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind k selectp -U
bind j selectp -D
bind h selectp -L
bind l selectp -R
bind ^k resizep -U 10
bind ^j resizep -D 10
bind ^h resizep -L 10
bind ^l resizep -R 10
bind r source-file ~/.tmux.conf \; display "Configuration Reloaded!"
bind -n 'F11' prev
bind -n 'F12' next
bind -n 'F8' kill-window
bind -n 'F9' new-window -c "#{pane_current_path}"

set -g status-bg black
set -g status-fg yellow

set -g pane-border-style bg=black,fg=green
set -g pane-active-border-style bg=default,fg=white

set -g status-interval 60

bind-key v select-layout even-vertical
set-window-option -g window-status-style fg=colour64
set-window-option -g window-status-current-style bg=blue,fg=yellow

# Save and restore windows, pane directories/layouts, and scrollback.
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-pane-contents-area 'full'
# Restore shells and saved text; restart applications manually.
set -g @resurrect-processes 'false'
set -g @continuum-save-interval '1'
set -g @continuum-restore 'on'
run-shell '~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
# Load last so status-right keeps both the clock and the autosave trigger.
run-shell '~/.tmux/plugins/tmux-continuum/continuum.tmux'
